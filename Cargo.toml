[workspace]
resolver = "2"
members = [
    "crates/kurung-policy",
    "crates/kurung-vfs",
    "crates/kurung-core",
    "crates/kurung-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["E. Brillianto <@koodoxz>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/koodoxz/kurung"
description = "Sub-millisecond deterministic WebAssembly confinement sandbox for autonomous AI agents"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
wasmi = "0.40"
wat = "1.220"
kurung-policy = { path = "crates/kurung-policy" }
kurung-vfs = { path = "crates/kurung-vfs" }
kurung-core = { path = "crates/kurung-core" }

